name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/machine_learning
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      MPLBACKEND: Agg
      IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: src/machine_learning/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install rendering and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libosmesa6 ffmpeg
      - name: Install locked project dependencies
        run: uv sync --locked --dev
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q main.py data evaluation tests training utilities
      - name: Build Python distributions
        run: uv build --out-dir /tmp/zeroshotbalancer-dist
      - name: Run all test suites
        run: uv run --locked python tests/run_tests.py --test-all -- -v
